name: Task
description: A unit of work on foundation
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Say who needs this, which packages it touches, and what is off limits, before any code is written.

  - type: dropdown
    id: consumer
    attributes:
      label: Who needs this
      description: The project that asked for it, or "platform" for repository-wide work.
      options:
        - aoni (protocol stack and HTTP client)
        - mach (protocol engines)
        - sein (server stack and web framework)
        - g-man (Steam SDK)
        - dawn (database drivers and data access)
        - seal (archives and containers)
        - platform (tooling, CI, docs)
    validations:
      required: true

  - type: input
    id: target_packages
    attributes:
      label: Packages to change
      description: Import paths relative to the module root.
      placeholder: "async/pool, silicon/cpukit"
    validations:
      required: true

  - type: input
    id: protected_packages
    attributes:
      label: Packages not to touch
      placeholder: "net/quic, codec/*"
    validations:
      required: false

  - type: textarea
    id: objective
    attributes:
      label: Problem and approach
      description: What is wrong today, what will you do about it, and which standard library compromise does this avoid?
      placeholder: |
        Problem:
        Approach:
        Compromise avoided:
    validations:
      required: true

  - type: dropdown
    id: alloc_budget
    attributes:
      label: Allocation tier
      description: See ADR-0003.
      options:
        - zero
        - amortized
        - bounded(N/op)
        - unconstrained
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Done when
      value: |
        - [ ] Tests pass and coverage has not dropped
        - [ ] `go test -race` is clean
        - [ ] Allocations match the declared tier
        - [ ] `doc.go` and examples are up to date
        - [ ] `make check` passes
    validations:
      required: true
